<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kamus-font/norse@main/norse.css">
    <title>Sign Up Form</title>
</head>

<body>
    <div class="container">
        <div class="left-side">
            <div class="logo-wrapper">
                <img src="./img/odin-lined.png" class="logo-img" alt="logo">
                <h1 class="logo-title">ODIN</h1>
            </div>
            <p>Photo by <a href="https://unsplash.com/id/@haliewestphoto" target="_blank">Halie West</a> on <a
                    href="https://unsplash.com/id/foto/tanaman-daun-hijau-dalam-fotografi-close-up-25xggax4bSA"
                    target="_blank">Unplash</a>
            </p>
        </div>
        <div class="right-side">
            <div class="heading">
                <h2>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest
                    dreams. Sign up now to get started.</h2>
                <br>
                <h2>You <i>know</i> you want to.</h2>
            </div>
            <form action="#" method="get">
                <div class="form-container">
                    <h2>Let's do this!</h2>
                    <div class="form-group">
                        <div class="form-control">
                            <label class="form-label" for="firstName">
                                FIRST NAME
                            </label>
                            <input class="form-input" type="text" required name="firstName" id="firstName">
                        </div>
                        <div class="form-control">
                            <label class="form-label" for="lastName">
                                LAST NAME
                            </label>
                            <input class="form-input" type="text" required name="lastName" id="lastName">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-control">
                            <label class="form-label" for="email">
                                EMAIL
                            </label>
                            <input class="form-input" type="email" required name="email" id="email">
                        </div>
                        <div class="form-control">
                            <label class="form-label" for="phoneNumber">
                                PHONE NUMBER
                            </label>
                            <input class="form-input" type="number" required name="phoneNumber" id="phoneNumber">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-control">
                            <label class="form-label" for="password">
                                PASSWORD
                            </label>
                            <input class="form-input" type="password" required name="password" id="password">
                        </div>
                        <div class="form-control">
                            <label class="form-label" for="confirmPassword">
                                CONFIRM PASSWORD
                            </label>
                            <input class="form-input" type="password" required name="confirmPassword"
                                id="confirmPassword">
                        </div>
                    </div>
                </div>
                <div class="form-bottom">
                    <button type="submit" class="submit-btn">Create Account</button>
                    <p class="fw-bold">
                        Already have an account? <a class="text-green text-decoration-none" href="#">Log in</a>
                    </p>
                </div>

            </form>
        </div>
    </div>
</body>

</html>
